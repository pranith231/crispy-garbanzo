
name: Build ClipForge APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ClipForge-AndroidStudio.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check and extract project
        run: |
          if [ ! -f "ClipForge-AndroidStudio.zip" ]; then
            echo "ERROR: ClipForge ZIP not found in repository root."
            exit 1
          fi

          mkdir -p buildsrc
          unzip -q ClipForge-AndroidStudio.zip -d buildsrc

          PROJECT_FILE=$(find buildsrc -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project settings.gradle.kts not found."
            find buildsrc -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build ClipForge APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
